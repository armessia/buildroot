image autoboot.vfat {
	vfat {
		files = {
			"autoboot/autoboot.txt",
			"autoboot/config.txt",
			"rpi-firmware/bootcode.bin"
		}
	}
	size = 16M
}

image boot.vfat {
	vfat {
		files = {
			"boot/config.txt",
			"boot/cmdline.txt",
			"rpi-firmware/fixup_cd.dat",
			"rpi-firmware/start_cd.elf",
			"bcm2837-rpi-3-b.dtb",
			"Image"
		}
	}
	size = 64M
}

image sdcard.img {
	hdimage {
	}

	partition autoboot {
		partition-type = 0xC
		bootable = "true"
		image = "autoboot.vfat"
		offset = 1024
	}

	partition bootA {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition bootB {
		size = 64M
		partition-type = 0xC
		bootable = "true"
	}

	partition rootfsA {
		size = 1G
		partition-type = 0x83
		image = "rootfs.ext4"
	}

	partition rootfsB {
		size = 1G
		partition-type = 0x83
	}
}
